'Waterproof.Team:Mixin.ColumnLayout':
  abstract: true
  properties:
    columns:
      type: string
      defaultValue: 'cols3'
      ui:
        label: i18n
        reloadIfChanged: true
        inspector:
          group: 'layout'
          position: 10
          editor: 'Neos.Neos/Inspector/Editors/SelectBoxEditor'
          editorOptions:
            values:
              cols1:
                label: i18n
              cols2:
                label: i18n
              cols3:
                label: i18n
              cols4:
                label: i18n

'Waterproof.Team:Document.Person':
  superTypes:
    'Neos.Neos:Document': true
    # Liefert taxonomyReferences samt Sitegeist-Editor mit.
    'Sitegeist.Taxonomy:Mixin.TaxonomyReferences': true
  ui:
    label: i18n
    icon: 'user'
    inspector:
      groups:
        person:
          label: i18n
          position: 20
        contact:
          label: i18n
          position: 30
  properties:
    # Der Seitentitel trägt den vollständigen Namen; hier stehen nur die Teile,
    # die für Sortierung und Anrede getrennt gebraucht werden.
    firstName:
      type: string
      ui:
        label: i18n
        reloadIfChanged: true
        inspector:
          group: 'person'
          position: 10
    lastName:
      type: string
      ui:
        label: i18n
        reloadIfChanged: true
        inspector:
          group: 'person'
          position: 20
    jobTitle:
      type: string
      ui:
        label: i18n
        reloadIfChanged: true
        inspector:
          group: 'person'
          position: 30
    portrait:
      type: 'Neos\Media\Domain\Model\ImageInterface'
      ui:
        label: i18n
        reloadIfChanged: true
        inspector:
          group: 'person'
          position: 40
    hasDetailPage:
      type: boolean
      defaultValue: false
      ui:
        label: i18n
        reloadIfChanged: true
        inspector:
          group: 'person'
          position: 50
        help:
          message: 'Ist die Detailseite aus, verlinken die Kacheln nicht und die Seite ist nicht aufrufbar.'
    phone:
      type: string
      ui:
        label: i18n
        inspector:
          group: 'contact'
          position: 10
    email:
      type: string
      ui:
        label: i18n
        inspector:
          group: 'contact'
          position: 20
      validation:
        'Neos.Neos/Validation/EmailAddressValidator': []
    room:
      type: string
      ui:
        label: i18n
        inspector:
          group: 'contact'
          position: 30
  childNodes:
    main:
      type: 'Neos.Neos:ContentCollection'

'Waterproof.Team:Document.TeamIndex':
  superTypes:
    'Neos.Neos:Document': true
    'Waterproof.Team:Mixin.ColumnLayout': true
  ui:
    label: i18n
    icon: 'users'
    inspector:
      groups:
        layout:
          label: i18n
          position: 20
  constraints:
    nodeTypes:
      '*': false
      'Waterproof.Team:Document.Person': true
  childNodes:
    main:
      type: 'Neos.Neos:ContentCollection'
